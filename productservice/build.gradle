plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.trustamarket'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

ext {
	// Spring Boot 3.x 버전과 호환되는 Spring Cloud 버전입니다.
	set('springCloudVersion', "2024.0.1")
}

dependencyManagement {
	imports {
		// 모든 Spring Cloud 관련 라이브러리(Feign, Eureka, Config 등)의 버전을 자동으로 관리합니다.
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

repositories {
	mavenCentral()
	maven {
		url = uri("https://maven.pkg.github.com/trusta-market/common")
		credentials {
			username = findProperty('gpr.user') ?: System.getenv('GPR_USER')
			password = findProperty('gpr.token') ?: System.getenv('GPR_TOKEN')
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.kafka:spring-kafka'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'com.trustamarket:common:0.0.1-SNAPSHOT'

	// Querydsl 의존성
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// AWS SDK v2 S3
	implementation 'software.amazon.awssdk:s3:2.25.0'

	// 서비스 검색 (Eureka Client) - Eureka 서버에 등록하기 위해 필요[cite: 1]
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	// 외부 설정 관리 (Config Client) - config-repo의 설정을 읽어오기 위해 필요[cite: 1]
	implementation 'org.springframework.cloud:spring-cloud-starter-config'

	// 다른 서비스 호출 (OpenFeign) - 만약 common에 포함되어 있지 않다면 직접 추가
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
}

// Querydsl QClass 생성 위치 설정
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
	main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
	options.getGeneratedSourceOutputDirectory().set(querydslDir)
}

clean {
	delete querydslDir
}

tasks.named('test') {
	useJUnitPlatform()
}
