server:
  port: 18081

spring:
  application:
    name: product-service
  main:
    allow-bean-definition-overriding: true

  security:
    user:
      name: ${SPRING_SECURITY_USER:admin}
      password: ${SPRING_SECURITY_PASSWORD:}

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:trusta_market}?currentSchema=${SCHEMA:p_product}
    username: ${POSTGRES_USER:trusta_admin}
    password: ${POSTGRES_PASSWORD:trusta_admin_pw}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${SCHEMA:p_product}
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${SCHEMA:p_product}
    baseline-on-migrate: true
    baseline-version: 0

  data:
    elasticsearch:
      uris: http://localhost:9200

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual
    consumer:
      group-id: product-sold-out-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.trustamarket.productservice.application.event
        spring.json.value.default.type: com.trustamarket.productservice.application.event.ProductSoldOutMessage

  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      enabled: true
    compatibility-verifier:
      enabled: false

trusta:
  security:
    trust-gateway-headers: true
  messaging:
    topic:
      product-sold-out: order.product.sold-out
      inspection-completed: inspection.completed
      inspection-price-accepted: inspection.price.accepted
      inspection-price-rejected: inspection.price.rejected

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket: ${AWS_S3_BUCKET}