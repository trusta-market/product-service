apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: product-service
          image: asia-northeast3-docker.pkg.dev/trusta-market-id/trusta-registry-services/product-service:PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8102
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: domain-postgres-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domain-postgres-secrets
                  key: DB_PASSWORD
            # AWS / ES env 는 K8s 에 없음. autoconfig exclude 로 회피 (application-k8s.yml 참조).
          # request 는 실 사용량 기반 (CPU ~25m, memory ~400Mi, burst 여유 포함).
          # limit memory 2Gi → 2.5Gi — pool 32 connection state + 3차 부하 시 restart 2회 (burst OOM 의심) 방지.
          # thread 800 stack 800MB + heap (limit*25%=625MB) + pool 32 connection state + 기타 = ~1.8GB → 2.5Gi 안 여유.
          resources:
            requests:
              cpu: 100m
              memory: 800Mi
            limits:
              cpu: 1500m
              memory: 2500Mi
          # startupProbe — /actuator/health/liveness (application 자체만).
          # /actuator/health (전체 합산) 는 외부 의존성 (Kafka/ES 등) 한 군데 DOWN 만 돼도 503 → kill.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8102
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8102
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8102
            periodSeconds: 5
