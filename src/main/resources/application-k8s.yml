# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).

server:
  port: 8102

spring:
  config:
    import: "optional:configserver:http://config-server"
  cloud:
    config:
      uri: http://config-server
      label: develop
      fail-fast: false
  datasource:
    url: jdbc:postgresql://postgres:5432/trusta_market
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: p_product
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  # Elasticsearch / AWS S3 는 K8s 환경에서 미사용 — autoconfig 비활성.
  # 단, 사용자 정의 ElasticsearchConfig bean 이 placeholder 를 요구해서 dummy URI 박음 (실제 connection 안 함).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
  data:
    elasticsearch:
      uris: http://localhost:9200    # placeholder 만 채움. 실제 호출 X (autoconfig exclude 상태)
  # Flyway — 기존 schema 에 history table 자동 초기화 (config-repo 의 -local.yml 패턴 그대로)
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: p_product
    baseline-on-migrate: true
    baseline-version: 0
  # Kafka — GKE namespace 'kafka' 의 StatefulSet 3 broker.
  # 새 cluster (별도 CLUSTER_ID), 토픽은 초기화됨 — 각 서비스가 자동 생성 또는 명시 생성 필요.
  kafka:
    bootstrap-servers: kafka.kafka:9092

# AWS S3 — K8s 환경에 미사용. S3Config bean 이 placeholder 요구 → dummy 박음 (실제 호출 X).
# 후속에 실제 S3 셋업 시 Secret 으로 교체.
cloud:
  aws:
    credentials:
      access-key: dummy
      secret-key: dummy
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket: dummy

# trusta 메시징 토픽 — config-repo 의 product-service-local.yml 에서 복사.
trusta:
  security:
    trust-gateway-headers: true
  messaging:
    topic:
      product-sold-out: order.product.sold-out
      inspection-completed: inspection.completed
      inspection-price-accepted: inspection.price.accepted
      inspection-price-rejected: inspection.price.rejected

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
