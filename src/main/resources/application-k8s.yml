# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).

server:
  port: 8102

spring:
  config:
    import: "optional:configserver:http://config-server"

  cloud:
    config:
      uri: http://config-server
      label: develop
      fail-fast: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/trusta_market
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: p_product
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: p_product
    liquibase-schema: p_product

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

  data:
    elasticsearch:
      uris: http://localhost:9200

  kafka:
    bootstrap-servers: kafka.kafka:9092
    listener:
      ack-mode: manual
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

cloud:
  aws:
    credentials:
      access-key: dummy
      secret-key: dummy
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket: dummy

trusta:
  security:
    trust-gateway-headers: true
  messaging:
    topic:
      product-sold-out: order.product.sold-out
      inspection-completed: inspection.completed
      inspection-price-accepted: inspection.price.accepted
      inspection-price-rejected: inspection.price.rejected

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
