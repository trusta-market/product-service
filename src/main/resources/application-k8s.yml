# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).

server:
  port: 8102
  # Tomcat — 부하 테스트 결과로 default threads.max=200 이 단일 pod 의 동시 처리 한계.
  # 800 으로 증액 (stack ~800MB, memory limit 2Gi 안). accept-count 도 같이 늘려서 queue 더 받음.
  tomcat:
    threads:
      max: 800
    accept-count: 300
    max-connections: 20000

spring:
  config:
    import: "optional:configserver:http://config-server"
  cloud:
    config:
      uri: http://config-server
      label: develop
      fail-fast: false
  datasource:
    # DB_HOST env 로 endpoint 주입 (Secret domain-postgres-secrets). default = postgres (in-cluster fallback).
    # Cloud SQL 마이그 시 Secret 의 DB_HOST 만 변경 → 코드 변경 X.
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/trusta_market
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # HikariCP pool — 8차 부하 결과로 pool 60/120 은 GC pause + tail latency 폭증 (DB 한가 + connection state heap 점유).
    # 6차 셋 (pool 18/32 + cache) 가 진짜 sweet spot — 그 셋으로 복귀.
    # product 만 cache 의 lookup 동시성 + miss 시 query 안전선으로 32 유지.
    hikari:
      maximum-pool-size: 32
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: p_product
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: p_product
    liquibase-schema: p_product
  # Elasticsearch / AWS S3 는 K8s 환경에서 미사용 — autoconfig 비활성.
  # 단, 사용자 정의 ElasticsearchConfig bean 이 placeholder 를 요구해서 dummy URI 박음 (실제 connection 안 함).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
  data:
    elasticsearch:
      uris: http://localhost:9200    # placeholder 만 채움. 실제 호출 X (autoconfig exclude 상태)
  # Kafka — GKE namespace 'kafka' 의 StatefulSet 3 broker.
  # 새 cluster (별도 CLUSTER_ID), 토픽은 초기화됨 — 각 서비스가 자동 생성 또는 명시 생성 필요.
  # listener.ack-mode: manual — KafkaListener 가 Acknowledgment 파라미터 받음.
  kafka:
    bootstrap-servers: kafka.kafka:9092
    listener:
      ack-mode: manual
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# AWS S3 — K8s 환경에 미사용. S3Config bean 이 placeholder 요구 → dummy 박음 (실제 호출 X).
# 후속에 실제 S3 셋업 시 Secret 으로 교체.
cloud:
  aws:
    credentials:
      access-key: dummy
      secret-key: dummy
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket: dummy

# trusta 메시징 토픽 — config-repo 의 product-service-local.yml 에서 복사.
trusta:
  security:
    trust-gateway-headers: true
  messaging:
    topic:
      product-sold-out: order.product.sold-out
      inspection-completed: inspection.completed
      inspection-price-accepted: inspection.price.accepted
      inspection-price-rejected: inspection.price.rejected

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
