spring:
  application:
    name: product-service
  main:
    allow-bean-definition-overriding: true

  # 테스트는 외부 config-server / elasticsearch / kafka / s3 자격증명 의존 X
  config:
    import: ""
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    compatibility-verifier:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:trusta_market}?currentSchema=${SCHEMA:p_product}
    username: ${POSTGRES_USER:trusta_admin}
    password: ${POSTGRES_PASSWORD:trusta_admin_pw}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${SCHEMA:p_product}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    elasticsearch:
      uris: http://localhost:9200

  kafka:
    bootstrap-servers: localhost:9092

  security:
    user:
      name: testuser
      password: testpass

# 테스트용 dummy 자격증명 — 실제 S3 호출 X (단위 test 컨텍스트 로드 목적)
cloud:
  aws:
    credentials:
      access-key: dummy-access-key
      secret-key: dummy-secret-key
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket: dummy-bucket

trusta:
  security:
    trust-gateway-headers: false