spring:
  application:
    name: product-service
  main:
    allow-bean-definition-overriding: true

  config:
    import: ""
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    compatibility-verifier:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:trusta_market}?currentSchema=${SCHEMA:p_product}
    username: ${POSTGRES_USER:trusta_admin}
    password: ${POSTGRES_PASSWORD:trusta_admin_pw}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none           # update → none (Liquibase가 DDL 관리)
    properties:
      hibernate:
        default_schema: ${SCHEMA:p_product}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false             # Flyway 자동 감지 차단

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092

  security:
    user:
      name: testuser
      password: testpass

cloud:
  aws:
    credentials:
      access-key: dummy-access-key
      secret-key: dummy-secret-key
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket: dummy-bucket

trusta:
  security:
    trust-gateway-headers: false
  outbox:
    poll-interval-ms: 1000
    max-retry: 5
  messaging:
    topic:
      product-sold-out: order.product.sold-out
      inspection-completed: inspection.completed